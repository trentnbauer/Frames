<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Frames serves this page at /portfolio/ and, on the portfolio hostname, at /. Everything below is relative to this base. -->
<base href="/portfolio/">
<title>Photography Portfolio</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-top">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><span id="theme-icon" aria-hidden="true"></span><span id="theme-label"></span></button>
    </div>
    <div class="hero-row">
      <img id="photographer-avatar" class="hero-avatar" alt="" hidden>
      <h1 id="photographer-name" class="hero-title">&nbsp;</h1>
    </div>
    <p id="tagline" class="hero-tagline" hidden></p>
    <p id="country" class="hero-country" hidden><svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M6 13s4.5-4 4.5-7.3A4.5 4.5 0 0 0 1.5 5.7C1.5 9 6 13 6 13z"/><circle cx="6" cy="5.5" r="1.6"/></svg><span id="country-name"></span></p>
    <nav id="site-nav" class="site-nav" aria-label="Site"></nav>
  </header>

  <main id="work" class="gallery-section">
    <p id="empty-hint" class="empty-hint" hidden>No photos yet. Add photos to the portfolio in Frames. This placeholder shows what the layout will look like.</p>
    <div id="gallery" class="gallery"></div>
  </main>

  <section id="gear" class="gear-page" hidden>
    <div id="gear-content" class="gear-content"></div>
  </section>

  <footer id="site-footer" class="site-footer" hidden></footer>
</div>
<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox-close" aria-label="Close" type="button">&times;</button>
  <img id="lightbox-img" class="lightbox-img" alt="">
  <div id="lightbox-spinner" class="lightbox-spinner" hidden></div>
  <div id="lightbox-caption" class="lightbox-caption" hidden></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
