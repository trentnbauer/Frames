<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frames</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Set the theme before first paint so there is no flash. -->
    <script>try{var t=localStorage.getItem('frames-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
