services:
  app:
    build: .
    container_name: frames-app
    restart: unless-stopped
    environment:
      - PORT=4000
      - DATA_DIR=/data
      # Optional vision-provider seeding — see .env.example for the full list
      # (FRAMES_OPENAI_*, FRAMES_ANTHROPIC_*, FRAMES_SELF_HOSTED_*) and
      # import-button credentials (FRAMES_GOOGLE_*, FRAMES_DROPBOX_APP_KEY).
      # - FRAMES_OPENAI_API_KEY=${FRAMES_OPENAI_API_KEY:-}
      # - FRAMES_OPENAI_MODEL=${FRAMES_OPENAI_MODEL:-}
      # - FRAMES_ANTHROPIC_API_KEY=${FRAMES_ANTHROPIC_API_KEY:-}
      # - FRAMES_ANTHROPIC_MODEL=${FRAMES_ANTHROPIC_MODEL:-}
      # - FRAMES_SELF_HOSTED_BASE_URL=${FRAMES_SELF_HOSTED_BASE_URL:-}
      # - FRAMES_SELF_HOSTED_API_KEY=${FRAMES_SELF_HOSTED_API_KEY:-}
      # - FRAMES_SELF_HOSTED_MODEL=${FRAMES_SELF_HOSTED_MODEL:-}
      # - FRAMES_GOOGLE_API_KEY=${FRAMES_GOOGLE_API_KEY:-}
      # - FRAMES_GOOGLE_CLIENT_ID=${FRAMES_GOOGLE_CLIENT_ID:-}
      # - FRAMES_DROPBOX_APP_KEY=${FRAMES_DROPBOX_APP_KEY:-}
      # - FRAMES_SOCIAL_HANDLES=${FRAMES_SOCIAL_HANDLES:-}
    volumes:
      - frames-data:/data
    ports:
      # Drop this if TunnelMate reaches the container over the shared network below
      # instead of the host.
      - "4000:4000"
    # Uncomment and point at your TunnelMate network so it can route to this
    # container by name (e.g. http://frames-app:4000) instead of the host port.
    # networks:
    #   - tunnelmate

volumes:
  frames-data:

