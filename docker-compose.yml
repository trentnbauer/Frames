# Frames has no built-in login, users, or access control of any kind — every
# route (view/delete photos, restore-from-backup which replaces the entire
# library, vision-provider API keys) is open to anyone who can reach this
# port. The `ports: 4000:4000` mapping below exposes it directly on the
# host's network. Do not put this on the open internet as-is — put it behind
# a reverse proxy (Caddy, nginx, Traefik) with auth (basic auth, oauth2-proxy,
# Authelia, etc.) or keep it on a private network / VPN / Tailscale only.
services:
  app:
    build: .
    container_name: frames-app
    restart: unless-stopped
    environment:
      - PORT=4000
      - DATA_DIR=/data
      # Optional vision-provider seeding — see .env.example for the full list
      # (OPENAI_*, ANTHROPIC_*, GEMINI_*, SELF_HOSTED_*) and import-button
      # credentials (GOOGLE_*, DROPBOX_APP_KEY).
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - OPENAI_MODEL=${OPENAI_MODEL:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # - GEMINI_MODEL=${GEMINI_MODEL:-}
      # - SELF_HOSTED_BASE_URL=${SELF_HOSTED_BASE_URL:-}
      # - SELF_HOSTED_API_KEY=${SELF_HOSTED_API_KEY:-}
      # - SELF_HOSTED_MODEL=${SELF_HOSTED_MODEL:-}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # - DROPBOX_APP_KEY=${DROPBOX_APP_KEY:-}
      # - SOCIAL_HANDLES=${SOCIAL_HANDLES:-}
    volumes:
      - frames-data:/data
    ports:
      # Drop this if TunnelMate reaches the container over the shared network below
      # instead of the host.
      - "4000:4000"
    # Uncomment and point at your TunnelMate network so it can route to this
    # container by name (e.g. http://frames-app:4000) instead of the host port.
    # networks:
    #   - tunnelmate

volumes:
  frames-data:

