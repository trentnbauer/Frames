# Frames. Copy .env.example to .env and edit it, then: docker compose up -d --build
services:
  frames:
    build: .
    # Set FRAMES_IMAGE in .env to run a published release instead of building here.
    image: ${FRAMES_IMAGE:-frames:local}
    init: true
    restart: unless-stopped
    ports:
      # Listens on this machine only by default. Before using 0.0.0.0 (all interfaces) turn on
      # sign-in: AUTH_PASSWORD here, or an OAuth provider in Settings, Access.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      AUTH_USER: ${AUTH_USER:-frames}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Public host name(s), only needed behind a reverse proxy that rewrites Host.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # true switches ALL sign-in inside Frames off: for one person behind something else that protects it, or to get back in (see README, Security).
      AUTH_DISABLE: ${AUTH_DISABLE:-false}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-false}
      SESSION_DAYS: ${SESSION_DAYS:-}
      # Set to 1 behind a reverse proxy, so share links rate-limit each visitor, not the proxy.
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Optional Cloudflare tunnel, set up by Frames itself (see README, Cloudflare tunnel). Leave empty to run without it.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      TUNNEL_NAME: ${TUNNEL_NAME:-Frames}
      APP_HOSTNAME: ${APP_HOSTNAME:-}
      ACCESS_EMAILS: ${ACCESS_EMAILS:-}
      PORTFOLIO_HOSTNAME: ${PORTFOLIO_HOSTNAME:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
    volumes:
      # Your photographs. Read-only: Frames never writes to them.
      - ${PHOTOS_DIR:-./photos}:/library:ro
      # Database and generated previews. Back this up.
      - frames-data:/data
    # Hardening: nothing in the container needs to write outside /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  frames-data:
