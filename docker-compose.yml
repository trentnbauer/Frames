services:
  app:
    image: ghcr.io/trentnbauer/frames:latest
    restart: unless-stopped
    environment:
      - PORT=4000
      - DATA_DIR=/data
      # Optional vision-provider seeding — see .env.example for the full list
      # (OPENAI_*, ANTHROPIC_*, GEMINI_*, SELF_HOSTED_*) and import-button
      # credentials (GOOGLE_*, DROPBOX_APP_KEY).
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - OPENAI_MODEL=${OPENAI_MODEL:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # - GEMINI_MODEL=${GEMINI_MODEL:-}
      # - SELF_HOSTED_BASE_URL=${SELF_HOSTED_BASE_URL:-}
      # - SELF_HOSTED_API_KEY=${SELF_HOSTED_API_KEY:-}
      # - SELF_HOSTED_MODEL=${SELF_HOSTED_MODEL:-}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # - DROPBOX_APP_KEY=${DROPBOX_APP_KEY:-}
      # - SOCIAL_HANDLES=${SOCIAL_HANDLES:-}
    volumes:
      - data:/data
    ports:
      - 4000:4000

volumes:
  data:

