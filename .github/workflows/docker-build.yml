name: Build Docker image

# Manual only — this publishes an image, so it shouldn't fire on every push.
# Run it from the Actions tab (or `gh workflow run docker-build.yml`) when
# you want to cut a new image, optionally at a specific tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag, on top of "latest" and the version read from package.json'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          # Fail loudly rather than silently pushing an image with no
          # version tag (or a malformed one) — package.json's version is
          # the single source of truth here, so bump it there to cut a
          # new version.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version \"$VERSION\" is not major.minor.patch" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine tags
        id: tags
        run: |
          # GHCR (like most registries) requires a lowercase image name —
          # github.repository preserves the repo's actual case ("Frames"),
          # which would make the push fail.
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${{ env.REGISTRY }}/$IMAGE_NAME:latest,${{ env.REGISTRY }}/$IMAGE_NAME:${{ steps.version.outputs.version }}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/$IMAGE_NAME:${{ inputs.tag }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
