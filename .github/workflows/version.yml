name: Create Version and Docker Container

# When a pull request is merged into main, its "release:" label decides the next version:
#   release: fix    1.2.3 -> 1.2.4      release: minor  1.2.3 -> 1.3.0
#   release: major  1.2.3 -> 2.0.0      release: none   no release
# This workflow creates the tag and a GitHub release, then publishes the Docker image (release.yml).
# The rules live in .github/scripts/next-version.sh. See README, "Versions and releases".
on:
  push:
    branches: [main]

permissions:
  contents: read

# One at a time, in order, so two quick merges never pick the same number.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then echo "No pull request for this commit: no release."; exit 0; fi
          labels="$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')"
          echo "Pull request #$pr, labels: $labels"
          version="$(git tag --list 'v*' | .github/scripts/next-version.sh "$labels")"
          if [ -z "$version" ]; then echo "Labelled release: none, so no release."; exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version already exists."; exit 1; fi
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          gh release create "v$version" --verify-tag --title "v$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.version != ''
    # A tag pushed with the workflow's own token does not start other workflows, so publish from here.
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
