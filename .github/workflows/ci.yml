name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs `tsc` for both workspaces (typecheck + compile) before tests,
      # same as a local `npm run build` — catches type errors that vitest
      # alone wouldn't.
      - run: npm run build

      - run: npm test
