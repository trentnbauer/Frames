name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets the release workflow run the same checks first

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/next-version.test.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # The server reads RAW files through these two programs (the Docker image has them too).
      - if: matrix.package == 'server'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl dcraw
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails on high-severity problems in what actually ships.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    # No `needs: test`: when this has nothing to do it should finish at once, not wait for the tests.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Building and starting the image is slow and can only newly break when the Dockerfile or the dependencies change, so a pull
      # request does it only then (and otherwise this check finishes in seconds and passes). Every push to main, and every release,
      # always does it, so a problem is caught right after a merge at the latest, and the release builds it again before publishing.
      - name: Does this change affect the image?
        id: image
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q --depth=1 origin "${{ github.base_ref }}"
            git diff --name-only FETCH_HEAD... | grep -qE '^(Dockerfile|\.dockerignore|(server|web)/package(-lock)?\.json)$' || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.run == 'true'
        run: docker build -t frames:ci .
      - name: Starts and reports healthy
        if: steps.image.outputs.run == 'true'
        run: |
          mkdir -p photos
          docker run -d --name frames -p 3000:3000 -v "$PWD/photos:/library:ro" -v frames-data:/data frames:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' frames)" = healthy ] && exit 0
            sleep 2
          done
          docker logs frames
          exit 1
      # The release publishes arm64 too. Building it under emulation takes two minutes.
      - if: steps.image.outputs.run == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.image.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.image.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
