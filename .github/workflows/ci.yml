name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets the release workflow run the same checks first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails on high-severity problems in what actually ships.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frames:ci .
      - name: Starts and reports healthy
        run: |
          mkdir -p photos
          docker run -d --name frames -p 3000:3000 -v "$PWD/photos:/library:ro" -v frames-data:/data frames:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' frames)" = healthy ] && exit 0
            sleep 2
          done
          docker logs frames
          exit 1
