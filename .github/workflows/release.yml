name: Create Docker Container

# A manually pushed version tag builds/tests each native image once, then publishes their manifest.
# Automatic main-branch releases use the same CI and publisher from version.yml.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_call:
    inputs:
      version:
        description: 'Version without the leading v.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      release-version: ${{ inputs.version || github.ref_name }}
      source-ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}

  publish:
    needs: checks
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version || github.ref_name }}
