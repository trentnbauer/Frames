name: Create Docker Container

# Publishes a Docker image to GitHub's container registry. It runs two ways:
#  - automatically, called by version.yml after a pull request with a "release: fix/minor/major"
#    label is merged (that workflow works out the version number and creates the tag);
#  - by hand, when someone pushes a version tag:  git tag v1.2.3 && git push origin v1.2.3
# The image gets the tags 1.2.3, 1.2, 1 and latest. Tags with a suffix (v1.2.3-rc.1) are
# published as that exact version only, never as latest.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_call:
    inputs:
      version:
        description: 'The version to publish, without the leading v (its tag must already exist)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/frames
      # The tag being published: the input when called by version.yml, otherwise the tag that was pushed.
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The "What's new" list inside the app: the merged pull requests so far, baked into the image.
      - name: Generate changelog.json from merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/generate-changelog.sh
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          # latest only for a plain release, not a pre-release
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
