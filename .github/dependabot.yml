version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    # better-sqlite3 13+ ships no prebuilt binaries, so the slim Docker image can't install it
    # (and arm64 builds would compile under emulation). Stay on 11 until that changes.
    ignore:
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node major versions are chosen by hand: native modules (better-sqlite3, sharp) must ship
    # prebuilt binaries for that version before the image can move to it.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
