services:
  app:
    image: ghcr.io/trentnbauer/frames:${FRAMES_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - ${PORT:-3000}:3000
    environment:
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_DISABLE: ${AUTH_DISABLE:-true}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP}
      SESSION_DAYS: ${SESSION_DAYS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - library:/library
      - data:/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  library:
