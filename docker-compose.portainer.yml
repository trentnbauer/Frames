services:
  app:
    image: ghcr.io/trentnbauer/frames:${FRAMES_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - ${PORT:-3000}:3000
    ## The exported env file (Settings, Env file): in Portainer, Stack, Environment variables, Load variables from .env file. Every setting is its own variable.
    env_file:
      - path: stack.env
        required: false
    environment:
      AUTH_DISABLE: ${AUTH_DISABLE:-true} ##Single User - authenticate with your CF Proxy
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-false}
      ## Settings, Env file exports every setting and secret as one file for this stack. It sets ALLOW_ENV_EXPORT=false so it cannot be downloaded twice.
      # Outgoing email (see .env.example). Optional: Settings, Email in the app does the same.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Frames}
      ALLOW_ENV_EXPORT: ${ALLOW_ENV_EXPORT:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      TURNSTILE_DISABLE: ${TURNSTILE_DISABLE:-}
      BACKUP_DIR: /backups
      ## Cloudflare tunnel, run by Frames itself (no separate tunnel container). Leave these empty to run without it.
      ## Easiest: make a tunnel at https://dash.cloudflare.com/?to=/:account/tunnels and set TUNNEL_TOKEN (README, Cloudflare tunnel has the steps)
      ## Or let Frames set it up and put a login in front of the app: the API token (https://dash.cloudflare.com/profile/api-tokens) needs Account > Cloudflare Tunnel: Edit, Account > Access: Apps and Policies: Edit, Zone > DNS: Edit, Zone > Zone: Read
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} ##A tunnel you made in the Cloudflare dashboard (Settings, Cloudflare tunnel explains how). Used instead of the API setup below
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      TUNNEL_NAME: ${TUNNEL_NAME:-Frames}
      APP_HOSTNAME: ${APP_HOSTNAME} ##The app, e.g. frames.example.com. Only reachable through Cloudflare Access
      ACCESS_EMAILS: ${ACCESS_EMAILS} ##Who Access lets in: comma-separated emails (required with APP_HOSTNAME)
      PORTFOLIO_HOSTNAME: ${PORTFOLIO_HOSTNAME} ##The public portfolio, e.g. gallery.example.com. Needs no login
    volumes:
      - library:/library
      - data:/data
      - backups:/backups ##The daily whole-server backup, and what Settings, Backup restores from
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  backups:
  library:
