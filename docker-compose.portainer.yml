services:
  app:
    image: ghcr.io/trentnbauer/frames:${FRAMES_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - ${HOST_PORT:-${PORT:-3000}}:3000 ##The port on the host. Not PORT: Frames reads PORT as the port it listens on inside the container
    environment:
      AUTH_DISABLE: ${AUTH_DISABLE:-true} ##Single User - authenticate with your CF Proxy
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      ## Cloudflare tunnel, set up by Frames itself (no separate tunnel container). Leave these empty to run without it.
      ## The API token needs: Account > Cloudflare Tunnel: Edit, Account > Access: Apps and Policies: Edit, Zone > DNS: Edit, Zone > Zone: Read
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      TUNNEL_NAME: ${TUNNEL_NAME:-Frames}
      APP_HOSTNAME: ${APP_HOSTNAME} ##The app, e.g. frames.example.com. Only reachable through Cloudflare Access
      ACCESS_EMAILS: ${ACCESS_EMAILS} ##Who Access lets in: comma-separated emails (required with APP_HOSTNAME)
      PORTFOLIO_HOSTNAME: ${PORTFOLIO_HOSTNAME} ##The public portfolio, e.g. gallery.example.com. Needs no login
    volumes:
      - library:/library
      - data:/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  library:
