# Dev stack: backend runs in Docker (API + SQLite + derivatives), frontend
# stays on the host via `npm run dev:web` for fast Vite hot-reload.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build -d
#   npm run dev:web    # separately, on the host — proxies to :4000 below
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: frames-server-dev
    environment:
      - PORT=4000
      - DATA_DIR=/data
      # Optional vision-provider / import-button env vars — see .env.example.
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - OPENAI_MODEL=${OPENAI_MODEL:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # - GEMINI_MODEL=${GEMINI_MODEL:-}
      # - SELF_HOSTED_BASE_URL=${SELF_HOSTED_BASE_URL:-}
      # - SELF_HOSTED_API_KEY=${SELF_HOSTED_API_KEY:-}
      # - SELF_HOSTED_MODEL=${SELF_HOSTED_MODEL:-}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # - DROPBOX_APP_KEY=${DROPBOX_APP_KEY:-}
      # - SOCIAL_HANDLES=${SOCIAL_HANDLES:-}
    volumes:
      - ./server/src:/app/server/src
      - ./data:/data
    ports:
      - "4000:4000"
