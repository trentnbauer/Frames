# Dev stack: backend runs in Docker (API + SQLite + derivatives), frontend
# stays on the host via `npm run dev:web` for fast Vite hot-reload.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build -d
#   npm run dev:web    # separately, on the host — proxies to :4000 below
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: frames-server-dev
    environment:
      - PORT=4000
      - DATA_DIR=/data
    volumes:
      - ./server/src:/app/server/src
      - ./data:/data
    ports:
      - "4000:4000"
